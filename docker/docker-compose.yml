name: "hartheus"

services:
  # AI Service (SAM3 batch inference)
  ai:
    build:
      context: ../AI
      dockerfile: ../docker/ai.Dockerfile
    container_name: hartheus-ai
    volumes:
      - ../AI/SAM:/app/SAM
      - ../AI/models:/app/models:ro
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
